[package]
name = "claux"
version = "20260805.0.1"
edition = "2021"
description = "Terminal AI coding assistant with tool execution"
license = "MIT"

[[bin]]
name = "claux"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
process-wrap = { version = "9.1", features = ["tokio1"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# HTTP + streaming
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Terminal
crossterm = "0.28"
# unstable-rendered-line-info: Paragraph::line_count, used to compute the
# exact wrapped row count for autoscroll (estimates under-count word wrap)
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
unicode-width = "0.2"

# File search
walkdir = "2.5"
glob = "0.3"

# Content search (ripgrep)
grep-regex = "0.1"
grep-matcher = "0.1"
grep-searcher = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Streaming
futures-util = "0.3"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
uuid = { version = "1.0", features = ["v4"] }

# Token estimation
tiktoken-rs = "0.9"

# Diff generation
similar = "2.6"
pulldown-cmark = "0.13.3"

# SQLite database
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }

# MCP (Model Context Protocol) client
rmcp = { version = "1.7", features = ["client", "transport-child-process"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.4"

[dev-dependencies]
tempfile = "3.0"
tuishot = { git = "https://github.com/ducks/tuishot" }
